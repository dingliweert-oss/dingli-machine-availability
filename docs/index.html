<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>DINGLI Europe | Machine Availability</title>
<style>:root{font-family:Arial,sans-serif;color:#172c3c;background:#f3f5f7}*{box-sizing:border-box}body{margin:0}header{background:#142c40;color:white;padding:26px 24px}h1{margin:0;font-size:27px}header p{margin:8px 0 0;color:#c7d5df}.wrap{max-width:1080px;margin:auto;padding:22px}.controls{display:flex;gap:9px;flex-wrap:wrap;margin:20px 0}button,input{padding:11px 14px;border:1px solid #d5dde5;border-radius:8px;font-size:14px;background:white}button{cursor:pointer}button.active{background:#18798d;color:#fff;border-color:#18798d}input{flex:1;min-width:210px}table{width:100%;border-collapse:collapse;background:white;border-radius:12px;overflow:hidden}th{text-align:left;background:#e8eef3}th,td{border-bottom:1px solid #e7edf1;padding:15px}small{color:#697681}.tag{padding:5px 9px;border-radius:20px;font-size:12px;font-weight:bold}.in-production{background:#fff0c2;color:#855d00}.in-transit{background:#dfeeff;color:#155b9b}.yes-in-weert{background:#e0f4e7;color:#216b41}@media(max-width:600px){h1{font-size:23px}th,td{padding:10px 6px;font-size:12px}.tag{display:inline-block}}</style></head>
<body><header><div class="wrap"><h1>DINGLI EUROPE</h1><p>Customer Machine Availability</p></div></header><main class="wrap"><div class="controls" id="filters"><button class="active" data-status="ALL">All machines</button><button data-status="IN PRODUCTION">In production</button><button data-status="IN TRANSIT">In transit</button><button data-status="YES - IN WEERT">In Weert</button><input id="search" type="search" placeholder="Search model or serial number"></div><div style="overflow-x:auto"><table><thead><tr><th>Model</th><th>Serial number</th><th>YOM</th><th>Status</th><th>ETA Weert</th></tr></thead><tbody id="records"><tr><td colspan="5">Loading...</td></tr></tbody></table></div><p><small id="updated">Loading data...</small></p><p><small>Subject to confirmation with our sales team.</small></p></main>
<script>let items=[],selected='ALL';const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){let q=document.getElementById('search').value.toLowerCase();let a=items.filter(x=>(selected==='ALL'||x.status===selected)&&`${x.model} ${x.serial}`.toLowerCase().includes(q));document.getElementById('records').innerHTML=a.length?a.map(x=>`<tr><td>${safe(x.model)}</td><td>${safe(x.serial)}</td><td>${safe(x.yom)}</td><td><span class="tag ${x.status.toLowerCase().replaceAll(' ','-')}">${safe(x.status)}</span></td><td>${safe(x.eta)}</td></tr>`).join(''):'<tr><td colspan="5">No matching machines</td></tr>';}document.querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>{selected=b.dataset.status;document.querySelectorAll('[data-status]').forEach(c=>c.classList.toggle('active',b===c));render();});document.getElementById('search').oninput=render;async function sync(){try{let r=await fetch('./data.json?'+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('fetch failed');let d=await r.json();items=d.machines.filter(x=>['IN PRODUCTION','IN TRANSIT','YES - IN WEERT'].includes(x.status));render();document.getElementById('updated').textContent='Last synchronized: '+new Date(d.updatedAt).toLocaleString()}catch(e){document.getElementById('updated').textContent='Updates temporarily unavailable. Contact sales for current availability.';if(!items.length)document.getElementById('records').innerHTML='<tr><td colspan="5">Availability temporarily unavailable</td></tr>'}}sync();setInterval(sync,60000);</script></body></html>
